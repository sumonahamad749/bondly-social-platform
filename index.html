<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>Bondly - Social Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d1b;color:#fff;padding-bottom:85px}
header{height:65px;background:#111a2d;border-bottom:1px solid #263650;display:flex;align-items:center;justify-content:space-between;padding:0 17px;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:900;color:#68aaff;letter-spacing:-1px}
.header-actions{display:flex;gap:10px;align-items:center}
.circle{width:39px;height:39px;border-radius:50%;background:#253653;display:grid;place-items:center}
button{border:0;cursor:pointer;border-radius:10px;padding:11px 15px;background:#287cff;color:white;font-weight:bold}
main{max-width:680px;margin:auto;padding:14px}
.card{background:#131e32;border:1px solid #253650;border-radius:17px;padding:16px;margin-bottom:15px}
.profile{display:flex;align-items:center;gap:11px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#287cff,#9c62ff);display:grid;place-items:center;font-size:21px;font-weight:bold}
.muted{color:#91a3bd;font-size:13px}
h2{font-size:19px;margin-bottom:12px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:5px 0 12px}
.story{min-width:76px;text-align:center}
.story-ring{height:66px;width:66px;margin:auto;border-radius:50%;padding:3px;background:linear-gradient(135deg,#348bff,#bb58ff)}
.story-inner{height:100%;border-radius:50%;background:#1a2942;display:grid;place-items:center;font-size:24px;border:3px solid #131e32}
.story p{font-size:12px;margin-top:6px;color:#c5d5ec}
textarea,input{width:100%;background:#0b1425;color:white;border:1px solid #30415f;padding:13px;border-radius:11px;margin:8px 0;font-size:15px}
textarea{resize:vertical;min-height:75px}
.full{width:100%;margin-top:8px}
.secondary{background:#273a59}
.post{padding:16px}
.post p{line-height:1.6;white-space:pre-wrap;margin:14px 0}
.post img{width:100%;max-height:450px;object-fit:contain;border-radius:12px;background:#090d18}
.post-head{display:flex;gap:10px;align-items:center}
.post-name{font-weight:bold}
.post-actions{display:flex;justify-content:space-around;border-top:1px solid #30415b;margin-top:14px;padding-top:12px}
.post-actions button{background:transparent;color:#b6c8e3;padding:8px}
.post-date{font-size:11px;color:#8ca0bb;margin-top:4px}
nav{position:fixed;bottom:0;left:0;width:100%;height:68px;background:#111a2d;border-top:1px solid #293b58;display:flex;justify-content:space-around;align-items:center;z-index:10}
nav button{background:transparent;color:#afc6e9;font-size:12px;padding:6px}
nav button.active{color:#62a8ff}
.hidden{display:none!important}
#status,#postStatus{font-size:13px;color:#7cdda9;margin-top:10px;overflow-wrap:anywhere}
.empty{text-align:center;padding:24px;color:#91a3bd}
</style>
</head>
<body>

<header>
<div class="logo">Bondly ✦</div>
<div class="header-actions">
<div class="circle">🔔</div>
<div class="circle" id="headerAvatar">S</div>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</div>
</header>

<main>

<section id="auth" class="card">
<h2>Welcome to Bondly ❤️</h2>
<p class="muted">Connect • Chat • Share</p>
<div id="loginFields">
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button class="full" onclick="login()">Login</button>
<button class="full secondary" onclick="showRegister()">Create Account</button>
<button class="full secondary" onclick="forgot()">Forgot Password?</button>
</div>
<div id="registerFields" class="hidden">
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Mobile Number">
<input id="regEmail" type="email" placeholder="Email Address">
<input id="regPassword" type="password" placeholder="Password">
<button class="full" onclick="register()">Sign Up</button>
<button class="full secondary" onclick="showLogin()">Back to Login</button>
</div>
<p id="status"></p>
</section>

<section id="home" class="hidden">

<div class="card">
<div class="profile">
<div class="avatar" id="welcomeAvatar">S</div>
<div>
<h2 id="welcome" style="margin-bottom:4px">Welcome!</h2>
<p class="muted">Your world. Your people. Your Bondly.</p>
</div>
</div>
</div>

<!-- STORIES -->
<div class="card">
<h2>Stories ✨</h2>
<div class="stories">
<div class="story"><div class="story-ring"><div class="story-inner">➕</div></div><p>Your Story</p></div>
<div class="story"><div class="story-ring"><div class="story-inner">🌸</div></div><p>Friends</p></div>
<div class="story"><div class="story-ring"><div class="story-inner">🌅</div></div><p>Moments</p></div>
<div class="story"><div class="story-ring"><div class="story-inner">🎵</div></div><p>Music</p></div>
<div class="story"><div class="story-ring"><div class="story-inner">🌍</div></div><p>World</p></div>
</div>
</div>

<!-- CREATE POST -->
<div class="card">
<h2>Create a Post ✍️</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">
<button class="full" id="shareBtn" onclick="createPost()">Share Post 🚀</button>
<p id="postStatus"></p>
</div>

<h2 style="margin:18px 4px">Latest Posts 🌍</h2>
<div id="feed"><div class="empty">Loading posts...</div></div>

</section>
</main>

<nav>
<button class="active" onclick="goHome()">🏠<br>Home</button>
<button onclick="comingSoon('Friends')">👥<br>Friends</button>
<button onclick="comingSoon('Chat')">💬<br>Chat</button>
<button onclick="comingSoon('Profile')">👤<br>Profile</button>
</nav>

<script>
const SUPABASE_URL='https://bokzlnjktwhugwjpotnx.supabase.co';
const SUPABASE_KEY='sb_publishable_06Xlq5qXzlGI53_JLhHyaw_-8zG2AgP';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let busy=false;

function message(id,text){
document.getElementById(id).textContent=text;
}

function showLogin(){
document.getElementById('loginFields').classList.remove('hidden');
document.getElementById('registerFields').classList.add('hidden');
message('status','');
}

function showRegister(){
document.getElementById('loginFields').classList.add('hidden');
document.getElementById('registerFields').classList.remove('hidden');
message('status','');
}

async function login(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
if(!email||!password){message('status','Enter email and password.');return;}
message('status','Logging in...');
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error){message('status',error.message);return;}
currentUser=data.user;
showHome();
}

async function register(){
const name=document.getElementById('name').value.trim();
const phone=document.getElementById('phone').value.trim();
const email=document.getElementById('regEmail').value.trim();
const password=document.getElementById('regPassword').value;
if(!name||!email||!password){message('status','Fill required fields.');return;}
if(password.length<6){message('status','Password needs at least 6 characters.');return;}
message('status','Creating account...');
const {data,error}=await db.auth.signUp({
email,password,
options:{data:{full_name:name,phone:phone},
emailRedirectTo:location.origin+location.pathname}
});
if(error){message('status',error.message);return;}
if(data.session){currentUser=data.user;showHome();}
else{message('status','Account created! Verify your email, then login.');}
}

async function forgot(){
const email=document.getElementById('email').value.trim();
if(!email){message('status','Enter your email first.');return;}
const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:location.origin+location.pathname
});
message('status',error?error.message:'Reset email sent.');
}

function showHome(){
document.getElementById('auth').classList.add('hidden');
document.getElementById('home').classList.remove('hidden');
document.getElementById('logoutBtn').classList.remove('hidden');
const name=currentUser.user_metadata?.full_name||currentUser.email;
document.getElementById('welcome').textContent='Welcome, '+name+'!';
document.getElementById('welcomeAvatar').textContent=name.charAt(0).toUpperCase();
document.getElementById('headerAvatar').textContent=name.charAt(0).toUpperCase();
loadPosts();
}

async function logout(){
await db.auth.signOut();
currentUser=null;
location.reload();
}

function goHome(){
if(currentUser)showHome();
}

async function createPost(){
if(busy)return;
busy=true;
const button=document.getElementById('shareBtn');
button.disabled=true;
try{
const {data:authData,error:authError}=await db.auth.getUser();
if(authError||!authData.user){
message('postStatus','Please login again.');
return;
}
const user=authData.user;
currentUser=user;
const content=document.getElementById('postText').value.trim();
const file=document.getElementById('postImage').files[0];
if(!content&&!file){message('postStatus','Write something or select an image.');return;}
message('postStatus','Publishing...');
let imageUrl=null;

if(file){
if(!file.type.startsWith('image/')){message('postStatus','Choose an image file.');return;}
if(file.size>5*1024*1024){message('postStatus','Image must be under 5 MB.');return;}
const path=user.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const {error:uploadError}=await db.storage.from('post-images').upload(path,file);
if(uploadError){message('postStatus',uploadError.message);return;}
imageUrl=db.storage.from('post-images').getPublicUrl(path).data.publicUrl;
}

const {error}=await db.from('posts').insert({
user_id:user.id,
content:content||null,
image_url:imageUrl
});
if(error){message('postStatus','Post failed: '+error.message);return;}
document.getElementById('postText').value='';
document.getElementById('postImage').value='';
message('postStatus','Post shared successfully! 🎉');
await loadPosts();
}catch(e){
message('postStatus','Error: '+e.message);
}finally{
busy=false;
button.disabled=false;
}
}

async function loadPosts(){
const feed=document.getElementById('feed');
feed.innerHTML='<div class="empty">Loading posts...</div>';
const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false}).limit(50);
if(error){feed.textContent='Feed error: '+error.message;return;}
feed.innerHTML='';
if(!data||!data.length){
feed.innerHTML='<div class="card empty">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনিই করুন! ❤️</div>';
return;
}
data.forEach(post=>{
const card=document.createElement('article');
card.className='card post';
const head=document.createElement('div');
head.className='post-head';
const avatar=document.createElement('div');
avatar.className='avatar';
avatar.textContent=post.user_id===currentUser.id?'S':'B';
const info=document.createElement('div');
const title=document.createElement('div');
title.className='post-name';
title.textContent=post.user_id===currentUser.id?'You':'Bondly Member';
const date=document.createElement('div');
date.className='post-date';
date.textContent=new Date(post.created_at).toLocaleString();
info.append(title,date);
head.append(avatar,info);
card.append(head);
if(post.content){
const p=document.createElement('p');
p.textContent=post.content;
card.append(p);
}
if(post.image_url){
const img=document.createElement('img');
img.src=post.image_url;
img.alt='Post image';
card.append(img);
}
const actions=document.createElement('div');
actions.className='post-actions';
['❤️ Like','💬 Comment','↗ Share'].forEach(label=>{
const b=document.createElement('button');
b.textContent=label;
b.onclick=()=>comingSoon(label);
actions.append(b);
});
card.append(actions);
feed.append(card);
});
}

function comingSoon(feature){
alert(feature+' feature is coming soon!');
}

async function checkSession(){
const {data,error}=await db.auth.getSession();
if(error){message('status',error.message);return;}
if(data.session){
currentUser=data.session.user;
showHome();
}
}

db.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_IN'&&session){
currentUser=session.user;
showHome();
}
});

checkSession();
</script>
</body>
</html>
