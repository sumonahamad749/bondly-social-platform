
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondly - Connect Together</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#090d18;color:#fff}
header{background:#111a2d;padding:17px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:bold;color:#62a8ff}
button{border:0;border-radius:10px;padding:12px;background:#287cff;color:white;font-weight:bold;cursor:pointer}
main{max-width:650px;margin:auto;padding:15px}
.card{background:#151e30;padding:17px;border-radius:15px;margin:14px 0;border:1px solid #26344c}
input,textarea{width:100%;padding:13px;margin:8px 0;background:#0c1423;color:white;border:1px solid #34445f;border-radius:9px}
textarea{min-height:90px;resize:vertical}
h2{margin-bottom:12px}
.small{color:#9eabc1;font-size:13px}
.post img{width:100%;border-radius:12px;margin-top:12px}
.post p{line-height:1.6;margin-top:10px;white-space:pre-wrap}
nav{display:flex;justify-content:space-around;background:#111a2d;padding:13px;position:sticky;bottom:0}
nav span{font-size:13px;color:#a9caff}
.hidden{display:none}
#status{color:#7cdbad;margin:10px 0}
</style>
</head>
<body>

<header>
<div class="logo">Bondly ✦</div>
<button id="logout" class="hidden" onclick="logout()">Logout</button>
</header>

<main>
<section id="auth" class="card">
<h2>Welcome to Bondly ❤️</h2>
<p class="small">Connect • Chat • Share</p>
<div id="registerFields" class="hidden">
<input id="name" placeholder="Your Full Name">
<input id="phone" placeholder="Mobile Number">
</div>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" onclick="login()" style="width:100%">Login</button>
<button id="registerBtn" onclick="register()" style="width:100%;margin-top:10px">Create Account</button>
<button onclick="forgot()" style="width:100%;margin-top:10px;background:#34445f">Forgot Password?</button>
<p id="status"></p>
</section>

<section id="home" class="hidden">
<div class="card">
<h2>Welcome to Bondly 👋</h2>
<p class="small">Your world. Your people. Your Bondly.</p>
</div>

<div class="card">
<h2>Create a Post ✍️</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">
<button onclick="createPost()" style="width:100%">Share Post 🚀</button>
<p id="postStatus"></p>
</div>

<h2>News Feed 🌍</h2>
<div id="feed"></div>
</section>
</main>

<nav>
<span>🏠 Home</span>
<span>👥 Friends</span>
<span>💬 Chat</span>
<span>👤 Profile</span>
</nav>

<script>
const SUPABASE_URL =
'https://bokzlnjktwhugwjpotnx.supabase.co';

const SUPABASE_KEY =
'sb_publishable_06Xlq5qXzlGI53_JLhHyaw_-8zG2AgP';

const db = window.supabase.createClient(
SUPABASE_URL,SUPABASE_KEY
);

let currentUser=null;

function message(id,text){
document.getElementById(id).textContent=text;
}

async function login(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

message('status','Please wait...');

const {data,error}=await db.auth.signInWithPassword({
email,password
});

if(error){
message('status',error.message);
return;
}
currentUser=data.user;
showHome();
}

async function register(){
const name=document.getElementById('name').value.trim();
const phone=document.getElementById('phone').value.trim();
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

if(!name||!email||!password){
message('status','Please fill all required fields');
return;
}

const {data,error}=await db.auth.signUp({
email,password,
options:{
emailRedirectTo:'https://sumonahamad749.github.io/bondly-social-platform/',
data:{full_name:name,phone:phone}
}
});

if(error){
message('status',error.message);
return;
}

message('status','Account created! Check your email for verification.');
}

async function forgot(){
const email=document.getElementById('email').value.trim();
if(!email){
message('status','Enter your email first');
return;
}
const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:'https://sumonahamad749.github.io/bondly-social-platform/'
});
message('status',error?error.message:'Password reset email sent.');
}

function showHome(){
document.getElementById('auth').classList.add('hidden');
document.getElementById('home').classList.remove('hidden');
document.getElementById('logout').classList.remove('hidden');
loadPosts();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function createPost(){
const content=document.getElementById('postText').value.trim();
const file=document.getElementById('postImage').files[0];

if(!content&&!file){
message('postStatus','Write something or select a photo.');
return;
}

message('postStatus','Publishing...');

let imageUrl=null;

if(file){
const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const path=currentUser.id+'/'+Date.now()+'-'+safeName;

const {error:uploadError}=await db.storage
.from('post-images')
.upload(path,file,{upsert:false});

if(uploadError){
message('postStatus','Image error: '+uploadError.message);
return;
}

const {data}=db.storage.from('post-images')
.getPublicUrl(path);

imageUrl=data.publicUrl;
}

const {error}=await db.from('posts').insert({
user_id:currentUser.id,
content:content||null,
image_url:imageUrl
});

if(error){
message('postStatus','Post error: '+error.message);
return;
}

document.getElementById('postText').value='';
document.getElementById('postImage').value='';
message('postStatus','Post published successfully! 🎉');
loadPosts();
}

async function loadPosts(){
const feed=document.getElementById('feed');
feed.innerHTML='<p class="small">Loading posts...</p>';

const {data,error}=await db.from('posts')
.select('*')
.order('created_at',{ascending:false})
.limit(50);

if(error){
feed.textContent='Could not load posts: '+error.message;
return;
}

feed.innerHTML='';

if(!data.length){
feed.innerHTML='<div class="card">No posts yet. Be the first to share! ❤️</div>';
return;
}

data.forEach(post=>{
const card=document.createElement('article');
card.className='card post';

const heading=document.createElement('strong');
heading.textContent=post.user_id===currentUser.id?
'You':'Bondly Member';

const date=document.createElement('div');
date.className='small';
date.textContent=new Date(post.created_at).toLocaleString();

card.append(heading,date);

if(post.content){
const p=document.createElement('p');
p.textContent=post.content;
card.append(p);
}

if(post.image_url){
const img=document.createElement('img');
img.src=post.image_url;
img.alt='Post image';
card.append(img);
}

feed.append(card);
});
}

async function checkSession(){
const {data}=await db.auth.getSession();
if(data.session){
currentUser=data.session.user;
showHome();
}
}

db.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_IN'&&session){
currentUser=session.user;
showHome();
}
});

document.getElementById('registerBtn').addEventListener('click',()=>{
document.getElementById('registerFields').classList.remove('hidden');
});

checkSession();
</script>
</body>
</html>
