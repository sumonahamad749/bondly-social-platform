
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bondly - Connect Together</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f5fa;color:#202438}
header{background:linear-gradient(120deg,#4938c9,#1678e8);color:white;padding:20px;position:sticky;top:0;z-index:5}
.top{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:#9fe7ff}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}
.logout{background:white;color:#4938c9}
main{max-width:700px;margin:25px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:17px;margin-bottom:18px;box-shadow:0 5px 22px #182b5010}
h2{margin-bottom:15px}
input,textarea{width:100%;padding:13px;border:1px solid #dce1ec;border-radius:10px;margin:7px 0 13px;font-size:15px}
textarea{resize:vertical;min-height:95px}
.primary{background:linear-gradient(120deg,#4938c9,#1678e8);color:white;width:100%;font-size:15px}
.switch{color:#4938c9;cursor:pointer;font-weight:bold}
.muted{color:#7e8799;font-size:13px}
.post{line-height:1.6;white-space:pre-wrap;margin:15px 0;overflow-wrap:anywhere}
.posthead{display:flex;align-items:center;gap:10px}
.avatar{width:43px;height:43px;border-radius:50%;background:#e4e8ff;color:#4938c9;display:grid;place-items:center;font-weight:bold;font-size:18px}
.name{font-weight:bold}
.actions{display:flex;gap:10px;border-top:1px solid #eee;padding-top:12px}
.actions button{background:#f1f3fa;color:#4b5270;flex:1}
.actions button.liked{color:#e13d69;background:#fff0f4}
.commentbox{display:flex;gap:7px;margin-top:12px}
.commentbox input{margin:0;min-width:0}
.commentbox button{background:#4938c9;color:white}
.comments{font-size:13px;margin-top:10px}
.comments p{padding:7px;background:#f6f7fb;border-radius:8px;margin-top:5px}
#app,#auth{display:none}
#status{text-align:center;padding:12px;color:#4938c9;font-size:13px}
.empty{text-align:center;padding:35px;color:#7e8799}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">B<span>ondly.</span></div>
<button class="logout" id="logout" onclick="logout()">Logout</button>
</div>
</header>

<main>
<div id="status">Bondly চালু হচ্ছে...</div>

<section id="auth" class="card">
<h2 id="authTitle">Welcome to Bondly 👋</h2>
<p class="muted" id="authDesc">Connect with people around you.</p>
<div id="nameField" style="display:none">
<label>আপনার নাম</label>
<input id="fullName" placeholder="আপনার পুরো নাম">
</div>
<label>Email Address</label>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<label>Password</label>
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button class="primary" id="authButton" onclick="authenticate()">Login to Bondly</button>
<p style="text-align:center;margin-top:16px;font-size:14px">
<span id="switchText">নতুন অ্যাকাউন্ট?</span>
<span class="switch" onclick="switchAuth()" id="switchButton">Sign Up</span>
</p>
</section>

<section id="app">
<div class="card">
<h2>Welcome to Bondly! 👋</h2>
<p class="muted">Connect • Chat • Share</p>
<p id="welcome" style="margin-top:10px;font-weight:bold"></p>
</div>

<div class="card">
<h2>What's on your mind? ✨</h2>
<textarea id="postContent" placeholder="আপনার মনের কথা লিখুন..."></textarea>
<button class="primary" onclick="createPost()">Publish Post</button>
</div>

<h2 style="margin:20px 5px">Your Feed 🌍</h2>
<div id="feed"></div>
</section>
</main>

<script>
// SUPABASE CONFIGURATION
const SUPABASE_URL = "https://bokzlnjktwhugwjpotnx.supabase.co";

// এখানে নিজের Supabase anon/public key বসাবে
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let isSignup = false;

const $ = id => document.getElementById(id);

function status(msg){$("status").textContent=msg;}

function switchAuth(){
isSignup=!isSignup;
$("authTitle").textContent=isSignup?"Create Your Bondly Account":"Welcome to Bondly 👋";
$("authDesc").textContent=isSignup?"Join our community today.":"Connect with people around you.";
$("nameField").style.display=isSignup?"block":"none";
$("authButton").textContent=isSignup?"Create Account":"Login to Bondly";
$("switchText").textContent=isSignup?"আগেই অ্যাকাউন্ট আছে?":"নতুন অ্যাকাউন্ট?";
$("switchButton").textContent=isSignup?"Login":"Sign Up";
}

async function authenticate(){
const email=$("email").value.trim();
const password=$("password").value;
if(!email||!password){alert("Email ও Password লিখুন");return;}
if(SUPABASE_KEY.includes("PASTE_")){
alert("প্রথমে Supabase anon public key বসাতে হবে।");
return;
}
status("অ্যাকাউন্ট যাচাই হচ্ছে...");
let result;
if(isSignup){
const name=$("fullName").value.trim();
if(!name){alert("আপনার নাম লিখুন");return;}
result=await db.auth.signUp({
email,password,
options:{data:{full_name:name}}
});
}else{
result=await db.auth.signInWithPassword({email,password});
}
if(result.error){alert(result.error.message);status("আবার চেষ্টা করুন");return;}
if(isSignup && !result.data.session){
status("আপনার ইমেইল যাচাই করুন, তারপর Login করুন।");
alert("Signup হয়েছে। ইমেইলে verification link পাঠানো হলে সেটি যাচাই করুন।");
return;
}
if(result.data.session) await loadApp(result.data.session.user);
}

async function logout(){
await db.auth.signOut();
currentUser=null;
$("app").style.display="none";
$("auth").style.display="block";
$("logout").style.display="none";
status("আপনি Logout করেছেন");
}

async function loadApp(user){
currentUser=user;
$("auth").style.display="none";
$("app").style.display="block";
$("logout").style.display="block";
const name=user.user_metadata?.full_name||user.email;
$("welcome").textContent="Hello, "+name;
status("Bondly is ready!");
await loadFeed();
}

async function createPost(){
const content=$("postContent").value.trim();
if(!content){alert("কিছু লিখুন");return;}
const {error}=await db.from("posts").insert({
user_id:currentUser.id,
content:content
});
if(error){alert(error.message);return;}
$("postContent").value="";
await loadFeed();
}

async function loadFeed(){
const feed=$("feed");
feed.innerHTML='<div class="empty">Loading posts...</div>';
const {data:posts,error}=await db.from("posts")
.select("*").order("created_at",{ascending:false}).limit(50);
if(error){feed.textContent="Feed error: "+error.message;return;}
if(!posts.length){feed.innerHTML='<div class="card empty">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনিই করুন! 🎉</div>';return;}

feed.innerHTML="";
for(const post of posts){
const [{data:profile},{data:likes},{data:myLike},{data:comments}]=await Promise.all([
db.from("profiles").select("full_name,username").eq("id",post.user_id).maybeSingle(),
db.from("likes").select("id",{count:"exact"}).eq("post_id",post.id),
db.from("likes").select("id").eq("post_id",post.id).eq("user_id",currentUser.id).maybeSingle(),
db.from("comments").select("*").eq("post_id",post.id).order("created_at",{ascending:true})
]);

const card=document.createElement("article");
card.className="card";

const head=document.createElement("div");
head.className="posthead";
const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent=(profile?.full_name||"U").charAt(0).toUpperCase();
const details=document.createElement("div");
const name=document.createElement("div");
name.className="name";
name.textContent=profile?.full_name||profile?.username||"Bondly User";
const date=document.createElement("div");
date.className="muted";
date.textContent=new Date(post.created_at).toLocaleString();
details.append(name,date);
head.append(avatar,details);

const body=document.createElement("div");
body.className="post";
body.textContent=post.content;

const actions=document.createElement("div");
actions.className="actions";
const like=document.createElement("button");
like.textContent=(myLike?"❤️":"🤍")+" Like ("+(likes?.length||0)+")";
if(myLike)like.className="liked";
like.onclick=()=>toggleLike(post.id,!!myLike);

const commentButton=document.createElement("button");
commentButton.textContent="💬 Comment ("+(comments?.length||0)+")";
actions.append(like,commentButton);

const commentArea=document.createElement("div");
commentArea.className="comments";
comments?.forEach(c=>{
const p=document.createElement("p");
p.textContent=c.content;
commentArea.append(p);
});

const inputRow=document.createElement("div");
inputRow.className="commentbox";
const input=document.createElement("input");
input.placeholder="একটি মন্তব্য লিখুন...";
const send=document.createElement("button");
send.textContent="Send";
send.onclick=()=>addComment(post.id,input.value);
inputRow.append(input,send);

commentButton.onclick=()=>inputRow.scrollIntoView({behavior:"smooth",block:"center"});
card.append(head,body,actions,commentArea,inputRow);
feed.append(card);
}
}

async function toggleLike(postId,liked){
if(liked){
const {error}=await db.from("likes").delete()
.eq("post_id",postId).eq("user_id",currentUser.id);
if(error)alert(error.message);
}else{
const {error}=await db.from("likes").insert({
post_id:postId,user_id:currentUser.id
});
if(error)alert(error.message);
}
await loadFeed();
}

async function addComment(postId,value){
const content=value.trim();
if(!content)return;
const {error}=await db.from("comments").insert({
post_id:postId,user_id:currentUser.id,content
});
if(error){alert(error.message);return;}
await loadFeed();
}

async function start(){
if(SUPABASE_KEY.includes("PASTE_")){
status("Supabase public key সেটআপ প্রয়োজন।");
$("auth").style.display="block";
$("logout").style.display="none";
return;
}
const {data,error}=await db.auth.getSession();
if(error){status(error.message);return;}
if(data.session)await loadApp(data.session.user);
else{
status("Welcome to Bondly");
$("auth").style.display="block";
$("logout").style.display="none";
}
db.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_IN" && session && !currentUser){
setTimeout(()=>loadApp(session.user),0);
}
});
}
start();
</script>
</body>
</html>
