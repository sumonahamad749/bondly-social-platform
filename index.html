
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bondly - Connect Together</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 min-height:100vh;
 background:linear-gradient(135deg,#07152e,#123b70,#2563eb);
 display:flex;align-items:center;justify-content:center;
 padding:20px;color:#172033
}
.container{
 width:100%;max-width:430px;background:#fff;
 border-radius:25px;padding:30px 25px;
 box-shadow:0 20px 60px #0005
}
.logo{text-align:center;margin-bottom:25px}
.logo-icon{
 width:65px;height:65px;border-radius:20px;
 background:linear-gradient(135deg,#2563eb,#06b6d4);
 display:inline-flex;align-items:center;justify-content:center;
 color:white;font-size:32px;font-weight:bold;
 margin-bottom:12px
}
.logo h1{font-size:32px;color:#2563eb}
.logo p{color:#718096;font-size:13px;margin-top:5px}
.tabs{display:flex;background:#edf2f7;padding:5px;
 border-radius:12px;margin-bottom:22px}
.tabs button{
 flex:1;border:0;padding:12px;border-radius:9px;
 font-weight:bold;color:#64748b;background:transparent
}
.tabs button.active{background:#2563eb;color:white}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;
 font-weight:bold;margin-bottom:7px;color:#334155}
.field input{
 width:100%;padding:14px;border:1px solid #dbe3ef;
 border-radius:11px;outline:none;font-size:15px
}
.field input:focus{border-color:#2563eb}
.main-btn{
 width:100%;padding:15px;border:0;border-radius:11px;
 background:linear-gradient(90deg,#2563eb,#0ea5e9);
 color:white;font-size:16px;font-weight:bold;
 margin-top:7px;cursor:pointer
}
.main-btn:disabled{opacity:.6}
.forgot{text-align:right;margin:12px 0}
.forgot button{
 border:0;background:none;color:#2563eb;cursor:pointer
}
.message{
 padding:12px;border-radius:10px;margin:12px 0;
 font-size:13px;display:none;line-height:1.5
}
.message.success{display:block;background:#dcfce7;color:#166534}
.message.error{display:block;background:#fee2e2;color:#991b1b}
.hidden{display:none!important}
.account{
 text-align:center;padding:20px 0
}
.avatar{
 width:75px;height:75px;border-radius:50%;
 background:#dbeafe;color:#2563eb;
 display:flex;align-items:center;justify-content:center;
 font-size:30px;margin:0 auto 15px
}
.account h2{margin-bottom:8px;color:#2563eb}
.account p{font-size:14px;color:#64748b;margin:7px 0;overflow-wrap:anywhere}
.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:25px}
</style>
</head>

<body>
<div class="container">

 <div class="logo">
  <div class="logo-icon">B</div>
  <h1>Bondly</h1>
  <p>Connect • Chat • Share</p>
 </div>

 <div id="authArea">

  <div class="tabs">
   <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
   <button id="registerTab" onclick="showForm('register')">Register</button>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">
   <div class="field">
    <label>Email Address</label>
    <input id="loginEmail" type="email" placeholder="Enter your email" required>
   </div>

   <div class="field">
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Enter password" required>
   </div>

   <div class="forgot">
    <button type="button" onclick="forgotPassword()">Forgot Password?</button>
   </div>

   <button class="main-btn" type="submit">Login to Bondly</button>
  </form>

  <form id="registerForm" class="hidden">
   <div class="field">
    <label>Full Name</label>
    <input id="fullName" type="text" placeholder="Your full name" required maxlength="80">
   </div>

   <div class="field">
    <label>Email Address</label>
    <input id="regEmail" type="email" placeholder="Your email address" required>
   </div>

   <div class="field">
    <label>Mobile Number</label>
    <input id="phone" type="tel" placeholder="+8801XXXXXXXXX" required maxlength="20">
   </div>

   <div class="field">
    <label>Password</label>
    <input id="regPassword" type="password" placeholder="At least 8 characters" minlength="8" required>
   </div>

   <button class="main-btn" type="submit">Create Account</button>
  </form>

 </div>

 <div id="accountArea" class="hidden account">
  <div class="avatar">B</div>
  <h2>Welcome to Bondly!</h2>
  <p id="userName"></p>
  <p id="userEmail"></p>
  <p id="userPhone"></p>
  <button class="main-btn" onclick="logout()">Logout</button>
 </div>

 <div class="footer">© 2026 Bondly. Connect Together.</div>
</div>

<script>
const SUPABASE_URL = "https://bokzlnjktwhugwjpotnx.supabase.co";
const SUPABASE_KEY = "sb_publishable_06Xlq5qXzlGI53_JLhHyaw_-8zG2AgP";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const SITE_URL = "https://sumonahamad749.github.io/bondly-social-platform/";

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const messageBox = document.getElementById("message");

function showMessage(text,type){
 messageBox.textContent=text;
 messageBox.className="message "+type;
}

function clearMessage(){
 messageBox.textContent="";
 messageBox.className="message";
}

function showForm(type){
 clearMessage();

 document.getElementById("loginTab").classList.toggle("active",type==="login");
 document.getElementById("registerTab").classList.toggle("active",type==="register");

 loginForm.classList.toggle("hidden",type!=="login");
 registerForm.classList.toggle("hidden",type!=="register");
}

registerForm.addEventListener("submit",async function(e){
 e.preventDefault();
 clearMessage();

 const name=document.getElementById("fullName").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const password=document.getElementById("regPassword").value;

 if(password.length<8){
  showMessage("Password must be at least 8 characters.","error");
  return;
 }

 const btn=registerForm.querySelector("button[type=submit]");
 btn.disabled=true;
 btn.textContent="Creating account...";

 try{
  const {data,error}=await db.auth.signUp({
   email:email,
   password:password,
   options:{
    emailRedirectTo:SITE_URL,
    data:{
     full_name:name,
     phone:phone
    }
   }
  });

  if(error) throw error;

  if(data.session){
   showMessage("Account created successfully! Welcome to Bondly.","success");
   registerForm.reset();
   await displayAccount(data.user);
  }else{
   showMessage("Registration successful! Please check your email and verify your account before login.","success");
   registerForm.reset();
   showForm("login");
  }

 }catch(error){
  showMessage(error.message,"error");
 }finally{
  btn.disabled=false;
  btn.textContent="Create Account";
 }
});

loginForm.addEventListener("submit",async function(e){
 e.preventDefault();
 clearMessage();

 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 const btn=loginForm.querySelector("button[type=submit]");
 btn.disabled=true;
 btn.textContent="Logging in...";

 try{
  const {data,error}=await db.auth.signInWithPassword({
   email,password
  });

  if(error) throw error;

  showMessage("Login successful!","success");
  await displayAccount(data.user);

 }catch(error){
  showMessage(error.message,"error");
 }finally{
  btn.disabled=false;
  btn.textContent="Login to Bondly";
 }
});

async function forgotPassword(){
 clearMessage();

 const email=document.getElementById("loginEmail").value.trim();

 if(!email){
  showMessage("Please enter your email address first.","error");
  return;
 }

 try{
  const {error}=await db.auth.resetPasswordForEmail(email,{
   redirectTo:SITE_URL
  });

  if(error) throw error;

  showMessage("Password reset link sent. Please check your email.","success");

 }catch(error){
  showMessage(error.message,"error");
 }
}

async function displayAccount(user){
 if(!user) return;

 document.getElementById("authArea").classList.add("hidden");
 document.getElementById("accountArea").classList.remove("hidden");

 document.getElementById("userName").textContent=
  "Name: "+(user.user_metadata?.full_name||"Bondly User");

 document.getElementById("userEmail").textContent=
  "Email: "+(user.email||"");

 document.getElementById("userPhone").textContent=
  "Phone: "+(user.user_metadata?.phone||"Not added");
}

async function logout(){
 const {error}=await db.auth.signOut();

 if(error){
  showMessage(error.message,"error");
  return;
 }

 document.getElementById("accountArea").classList.add("hidden");
 document.getElementById("authArea").classList.remove("hidden");

 loginForm.reset();
 showForm("login");
 showMessage("You have logged out successfully.","success");
}

async function checkSession(){
 const {data,error}=await db.auth.getSession();

 if(error){
  showMessage(error.message,"error");
  return;
 }

 if(data.session){
  await displayAccount(data.session.user);
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"){
  showMessage("Password recovery link verified. Password update screen will be added next.","success");
 }
});

checkSession();
</script>
</body>
</html>
